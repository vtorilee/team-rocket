<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokémon Growth Line Chart</title>

  <!-- Vega libraries -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* 🔥 CHART BACKGROUND (POKEDEX IMAGE) */
    #vis {
      display: flex;
      justify-content: center;
      margin-top: 20px;

      background-image: url("../images/pokedex.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      padding: 20px;
      border-radius: 16px;

      /* makes chart readable on dark background */
      background-color: rgba(0, 0, 0, 0.35);
    }

    /* optional: remove Vega menu */
    .vega-embed summary {
      display: none;
    }
  </style>
</head>

<body>

  <h1>Pokémon Growth by Generation</h1>

  <!-- chart container -->
  <div id="vis"></div>

  <!-- your JS file -->
  <script src="../vis_total2.js"></script>

</body>
</html>
