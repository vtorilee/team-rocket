<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokémon Type Sunburst</title>
  <link rel="stylesheet" href="../visualizations.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>

    body {  
      margin: 0;  
      overflow: hidden;  
    }

    #chart { 
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
      height: auto;
      min-height: 650px;
      width: 100%;
      overflow: hidden; 
}
    .type-display { text-align: center; font-size: 24px; font-family: sans-serif; margin-top: 20px; font-weight: bold; }
    #tooltip {
      position: absolute;
      padding: 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ccc;
      border-radius: 8px;
      pointer-events: none;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    .tooltip-card { min-width: 120px; }
    
  </style>
</head>
<body class="sunburst-page">
  
  <div class="sunburst-vis">
    <div id="chart"></div>
    <div id="tooltip"></div>
  </div>

  <script src="./types.js"></script>
</body>
</html>

<script>
function sendHeight() {
  const height = document.body.scrollHeight;
  window.parent.postMessage({ type: "setHeight", height }, "*");
}

window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);
</script>
